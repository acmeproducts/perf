<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Orbital8 UI R4.9.1 Test</title></head>
<body style="margin:0;background:#000;color:#fff;font-family:system-ui,sans-serif">
<div id="boot" style="position:fixed;inset:0;display:grid;place-items:center;background:#000;z-index:999999">Loading R4.9.1…</div>
<script>
(async()=>{
  const source=await fetch('./ui-v2.html?r491-source=1',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Unable to load test baseline');return r.text();});
  const patch=`<script>
(()=>{
  const install=()=>{
    const gallery=window.SpatialGallery;
    const scene=gallery?.elements?.scene;
    if(!gallery||!scene){setTimeout(install,25);return;}
    if(scene.dataset.r491ExactHit==='1')return;
    scene.dataset.r491ExactHit='1';

    const originalRender=gallery.render.bind(gallery);
    gallery.render=function(time){
      const result=originalRender(time);
      this.cards.forEach(card=>{card.element.style.opacity='1';});
      return result;
    };

    let tapStart=null;
    const nearestVisibleCard=(x,y)=>{
      let best=null;
      let bestDistance=Infinity;
      gallery.cards.forEach(card=>{
        const rect=card.element.getBoundingClientRect();
        if(x<rect.left||x>rect.right||y<rect.top||y>rect.bottom)return;
        const cx=(rect.left+rect.right)/2;
        const cy=(rect.top+rect.bottom)/2;
        const distance=Math.hypot(x-cx,y-cy);
        if(distance<bestDistance){best=card;bestDistance=distance;}
      });
      return best;
    };

    scene.addEventListener('pointerdown',event=>{
      if(event.button!==undefined&&event.button!==0)return;
      tapStart={x:event.clientX,y:event.clientY,pointerId:event.pointerId};
    },true);

    scene.addEventListener('pointerup',event=>{
      if(!tapStart||event.pointerId!==tapStart.pointerId)return;
      const moved=Math.hypot(event.clientX-tapStart.x,event.clientY-tapStart.y)>8;
      tapStart=null;
      if(moved)return;
      const card=nearestVisibleCard(event.clientX,event.clientY);
      if(!card)return;
      event.preventDefault();
      event.stopImmediatePropagation();
      gallery.handleCardTap(card.fileId,card.element);
    },true);

    gallery.requestFrame();
  };
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',install,{once:true});else install();
})();
<\/script>`;
  let html=source
    .replace('R4.8 stable Explore anchor without stack reorder','R4.9.1 exact far-side Explore targeting')
    .replace("reconstruction-R4.8-stable-explore-anchor-2026.08.22.1","reconstruction-R4.9.1-farside-targeting-2026.08.22.1")
    .replace('</body>',patch+'</body>');
  document.open();document.write(html);document.close();
})().catch(error=>{document.getElementById('boot').textContent='Test build failed to load: '+error.message;});
</script>
</body>
</html>
