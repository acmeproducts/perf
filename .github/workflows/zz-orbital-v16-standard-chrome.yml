name: temporary-orbital-v16-standard-chrome
on:
  push:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -c "import base64,gzip,pathlib;p=pathlib.Path('ui-v2.html');s=p.read_text();x=gzip.decompress(base64.b64decode('')).decode();i=s.rfind('</body>');assert i>=0 and 'orbital8-v16-standard-chrome-script' not in s;p.write_text(s[:i]+x+s[i:])"
      - run: git diff --check && grep -q orbital8-v16-standard-chrome-script ui-v2.html
      - run: git config user.name github-actions && git config user.email actions@github.com && git add ui-v2.html && git commit -m 'Standardize Explore and Table on Focus chrome' && git push
