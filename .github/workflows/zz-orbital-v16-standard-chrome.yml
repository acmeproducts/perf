name: temporary-orbital-v16-standard-chrome

on:
  push:
    paths:
      - '.github/workflows/zz-orbital-v16-standard-chrome.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply v1.6
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          p=Path('ui-v2.html'); s=p.read_text(encoding='utf-8')
          if 'orbital8-v16-standard-chrome-script' in s: raise SystemExit('already installed')
          patch=r'''
<!-- Orbital8 v1.6 standard-chrome -->
<style id="orbital8-v16-standard-chrome-style">
body.orbital-explore-inspecting #spatial-gallery-folder,body.orbital-explore-inspecting #spatial-gallery-details,body.orbital-explore-inspecting #spatial-gallery-count,body.orbital-explore-inspecting #spatial-gallery-delete,body.orbital-explore-inspecting #back-button,body.orbital-explore-inspecting #normal-image-count,body.orbital-explore-inspecting #center-trash-btn,body.orbital-explore-inspecting .pill-counter,body.orbital-table-standard #photo-table-folder,body.orbital-table-standard #photo-table-details,body.orbital-table-standard #photo-table-count,body.orbital-table-standard #photo-table-delete,body.orbital-table-standard #back-button,body.orbital-table-standard #normal-image-count,body.orbital-table-standard #center-trash-btn,body.orbital-table-standard .pill-counter{display:none!important}
body.orbital-explore-inspecting #focus-stack-name,body.orbital-explore-inspecting #focus-image-count,body.orbital-explore-inspecting #focus-favorite-btn,body.orbital-explore-inspecting #focus-delete-btn,body.orbital-explore-inspecting #details-button,body.orbital-table-standard #focus-stack-name,body.orbital-table-standard #focus-image-count,body.orbital-table-standard #focus-favorite-btn,body.orbital-table-standard #focus-delete-btn,body.orbital-table-standard #details-button{display:flex!important;position:fixed!important;z-index:15020!important}
body.orbital-explore-inspecting #focus-stack-name,body.orbital-table-standard #focus-stack-name{top:max(16px,env(safe-area-inset-top))!important;left:max(16px,env(safe-area-inset-left))!important}
body.orbital-explore-inspecting #details-button,body.orbital-table-standard #details-button{top:max(16px,env(safe-area-inset-top))!important;right:max(16px,env(safe-area-inset-right))!important}
body.orbital-explore-inspecting #focus-image-count,body.orbital-table-standard #focus-image-count{bottom:max(20px,env(safe-area-inset-bottom))!important;left:max(16px,env(safe-area-inset-left))!important}
body.orbital-explore-inspecting #focus-favorite-btn,body.orbital-table-standard #focus-favorite-btn{bottom:max(20px,env(safe-area-inset-bottom))!important;left:50%!important;transform:translateX(-50%)!important}
body.orbital-explore-inspecting #focus-delete-btn,body.orbital-table-standard #focus-delete-btn{bottom:max(20px,env(safe-area-inset-bottom))!important;right:max(16px,env(safe-area-inset-right))!important}
body.orbital-table-standard #photo-table [data-table-pile="in"],body.orbital-table-standard #photo-table [data-table-stack="in"]{display:none!important}
body.orbital-table-standard #photo-table [data-table-pile="priority"],body.orbital-table-standard #photo-table [data-table-stack="priority"]{top:72px!important;bottom:auto!important;left:50%!important;right:auto!important;transform:translateX(-50%)!important}
body.orbital-table-standard #photo-table [data-table-pile="trash"],body.orbital-table-standard #photo-table [data-table-stack="trash"]{bottom:82px!important;top:auto!important;left:50%!important;right:auto!important;transform:translateX(-50%)!important}
body.orbital-table-standard #photo-table [data-table-pile="out"],body.orbital-table-standard #photo-table [data-table-stack="out"]{right:18px!important;left:auto!important;top:50%!important;bottom:auto!important;transform:translateY(-50%)!important}
</style>
<script id="orbital8-v16-standard-chrome-script">
(()=>{'use strict';const VERSION='v1.6 standard-chrome';
function sync(){Core.updateImageCounters?.();Core.updateFavoriteButton?.()}
function relabel(){const root=PhotoTable.elements?.root||document.getElementById('photo-table');if(!root)return;const labels={priority:'YES',out:'MAYBE',trash:'NO'};root.querySelectorAll('[data-table-pile],[data-table-stack]').forEach(el=>{const n=el.dataset.tablePile||el.dataset.tableStack;if(n==='in'){el.hidden=true;return}if(!labels[n])return;el.hidden=false;const c=state.stacks[n]?.length||0;el.innerHTML=`<span class="orbital-target-label">${labels[n]}</span><span class="orbital-target-count">${c}</span>`;el.setAttribute('aria-label',`${labels[n]} stack, ${c} images`);el.title=`${labels[n]} · ${c}`})}
const o=PhotoTable.open.bind(PhotoTable);PhotoTable.open=function(x={}){const r=o(x);document.body.classList.add('orbital-table-standard');relabel();sync();return r};
const c=PhotoTable.close.bind(PhotoTable);PhotoTable.close=function(x={}){document.body.classList.remove('orbital-table-standard');return c(x)};
const f=PhotoTable.refreshPiles.bind(PhotoTable);PhotoTable.refreshPiles=function(){const r=f();relabel();return r};
const d=PhotoTable.down.bind(PhotoTable);PhotoTable.down=function(e){const r=d(e);sync();return r};
document.addEventListener('visibilitychange',()=>{if(!document.hidden){if(!PhotoTable.elements?.root?.hidden){document.body.classList.add('orbital-table-standard');relabel();sync()}if(document.body.classList.contains('orbital-explore-inspecting'))sync()}},true);
document.querySelectorAll('.footer-baseline').forEach(el=>{if(el.textContent.includes('Orbital8 UI'))el.textContent=`Orbital8 UI · ${VERSION}`});state.syncLog?.log?.({event:'ui:v16-installed',level:'info',details:'Focus chrome standard; Table YES/MAYBE/NO.'})})();
</script>
'''
          i=s.rfind('</body>'); assert i>=0
          p.write_text(s[:i]+patch+s[i:],encoding='utf-8')
          PY
      - name: Validate and commit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only)" = "ui-v2.html"
          grep -q 'orbital8-v16-standard-chrome-script' ui-v2.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ui-v2.html
          git commit -m 'Standardize Explore and Table on Focus chrome'
          git push origin HEAD:main
