name: temporary-orbital-v141-focus-chrome

on:
  push:
    paths:
      - '.github/workflows/zz-orbital-v141-focus-chrome.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Insert v1.4.1 Explore Focus chrome patch
        shell: python
        run: |
          from pathlib import Path
          import base64, gzip, hashlib
          payload = ''''''
          fragment = gzip.decompress(base64.b64decode(payload)).decode('utf-8')
          expected = '35174b93a772a691cba38f30bb504ed7739ef751569222f7a30b1a03d7987590'
          actual = hashlib.sha256(fragment.encode()).hexdigest()
          if actual != expected:
              raise SystemExit(f'payload sha mismatch: {actual}')
          path = Path('ui-v2.html')
          text = path.read_text(encoding='utf-8')
          marker = 'orbital8-v141-focus-chrome-script'
          if marker in text:
              raise SystemExit('v1.4.1 already present')
          idx = text.rfind('</body>')
          if idx < 0:
              raise SystemExit('closing body not found')
          path.write_text(text[:idx] + fragment + text[idx:], encoding='utf-8')
      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = "ui-v2.html"
          grep -q 'orbital8-v141-focus-chrome-script' ui-v2.html
          grep -q 'ExploreFocusChromeV141' ui-v2.html
          grep -q "v1.4.1 focus-chrome" ui-v2.html
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('ui-v2.html').read_text(encoding='utf-8')
          m = re.search(r'<script id="orbital8-v141-focus-chrome-script">\n(.*?)\n</script>', text, re.S)
          assert m
          Path('/tmp/v141.js').write_text(m.group(1), encoding='utf-8')
          assert text.count('id="orbital8-v141-focus-chrome-script"') == 1
          PY
          node --check /tmp/v141.js
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ui-v2.html
          test "$(git diff --cached --name-only)" = "ui-v2.html"
          git commit -m 'Reuse Focus chrome in Explore inspection'
          git push origin HEAD:main
