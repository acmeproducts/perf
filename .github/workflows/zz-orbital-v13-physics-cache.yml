name: temporary-orbital-v13-physics-cache

on:
  push:
    paths:
      - '.github/workflows/zz-orbital-v13-physics-cache.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Orbital8 v1.3 physics-cache
        shell: python
        run: |
          from pathlib import Path
          import base64, re
          path = Path('ui-v2.html')
          text = path.read_text(encoding='utf-8')
          marker = 'orbital8-v13-physics-cache-script'
          if marker in text:
              raise SystemExit('v1.3 marker already exists; refusing duplicate install')
          css = base64.b64decode('LyogT3JiaXRhbDggdjEuMyBwaHlzaWNzLWNhY2hlICovCi5vcmJpdGFsLWZ4LWNhbnZhc3twb3NpdGlvbjphYnNvbHV0ZTtpbnNldDowO3otaW5kZXg6MTE4MDtwb2ludGVyLWV2ZW50czpub25lO3dpZHRoOjEwMCU7aGVpZ2h0OjEwMCV9Ci5waG90by10YWJsZV9fc3RhY2tz e3Bvc2l0aW9uOmFic29sdXRlIWltcG9ydGFudDtpbnNldDowIWltcG9ydGFudDtkaXNwbGF5OmJsb2NrIWltcG9ydGFudDtwb2ludGVyLWV2ZW50czpub25lIWltcG9ydGFudDt6LWluZGV4OjEyNTAhaW1wb3J0YW50fQ=='.replace(' ', '')).decode('utf-8')
          js = base64.b64decode(' ...TRUNCATED...').decode('utf-8')
          block = "\n<!-- Orbital8 v1.3 physics-cache -->\n<style id=\"orbital8-v13-physics-cache-style\">\n" + css + "\n</style>\n<script id=\"orbital8-v13-physics-cache-script\">\n" + js + "\n</script>\n"
          idx = text.rfind('</body>')
          if idx < 0:
              raise SystemExit('closing body not found')
          text = text[:idx] + block + text[idx:]
          path.write_text(text, encoding='utf-8')
      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'orbital8-v13-physics-cache-script' ui-v2.html
          grep -q 'OrbitalImageCache' ui-v2.html
          grep -q 'sorting-target-layout:v1' ui-v2.html
          grep -q 'Grid._tilePool' ui-v2.html
          grep -q 'restoreExactSurfaceV13' ui-v2.html
          python - <<'PY2'
          from pathlib import Path
          import re
          text=Path('ui-v2.html').read_text(encoding='utf-8')
          m=re.search(r'<script id="orbital8-v13-physics-cache-script">\n(.*?)\n</script>',text,re.S)
          assert m, 'v1.3 script missing'
          Path('/tmp/v13.js').write_text(m.group(1),encoding='utf-8')
          assert text.count('id="orbital8-v13-physics-cache-script"') == 1
          assert text.count('id="orbital8-v13-physics-cache-style"') == 1
          PY2
          node --check /tmp/v13.js
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ui-v2.html
          git commit -m 'Implement shared cache and physics sorting'
          git push origin HEAD:main
