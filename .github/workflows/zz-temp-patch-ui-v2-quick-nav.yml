name: Temporary ui-v2 quick-nav patch

on:
  push:
    paths:
      - '.github/workflows/zz-temp-patch-ui-v2-quick-nav.yml'

permissions:
  contents: write

jobs:
  patch-ui-v2:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply surgical quick-nav patch
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('ui-v2.html')
          text = path.read_text(encoding='utf-8')
          original = text

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              '<!-- Orbital8- baseline V9b -->',
              '<!-- Orbital8- baseline V9.1 | quick view switcher -->',
              'version comment'
          )

          old_css = '''        .app-footer .footer-baseline {
            color: rgba(255, 255, 255, 0.6);
        }
        .submode-footer {
            position: fixed; z-index: 14000; left: 0; right: 0; bottom: 0;
            min-height: 44px; padding: 0 max(8px, env(safe-area-inset-right)) env(safe-area-inset-bottom) max(8px, env(safe-area-inset-left));
            display: flex; align-items: stretch; color: #e5e7eb; background: rgba(15, 23, 42, .9); backdrop-filter: blur(12px);
        }
        .submode-footer[hidden] { display: none; }
        .submode-footer__mode, .submode-footer__exit { min-height: 44px; padding: 0 16px; border: 0; color: inherit; background: transparent; font: 600 13px/1 system-ui, sans-serif; }
        .submode-footer__mode[aria-current="page"] { background: rgba(255,255,255,.16); box-shadow: inset 0 3px #93c5fd; }
        .submode-footer__separator { align-self: center; height: 24px; margin-left: auto; border-left: 1px solid rgba(255,255,255,.3); }
        .submode-footer__exit { min-width: 52px; font-size: 22px; cursor: pointer; }
'''
          new_css = '''        .app-footer .footer-baseline {
            color: rgba(255, 255, 255, 0.6);
        }
        /* v9.1: the existing footer is the only persistent navigation trigger.
           Sort geometry is intentionally untouched; the view chooser overlays only when requested. */
        .app-container > .app-footer {
            z-index: 14010;
            cursor: pointer;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        .quick-view-switcher {
            position: fixed;
            z-index: 14020;
            left: 50%;
            bottom: calc(30px + env(safe-area-inset-bottom));
            transform: translateX(-50%);
            width: min(380px, calc(100vw - 16px));
            height: 42px;
            padding: 3px;
            display: flex;
            align-items: stretch;
            gap: 2px;
            border: 1px solid rgba(255,255,255,.22);
            border-radius: 999px;
            color: #e5e7eb;
            background: rgba(15,23,42,.94);
            backdrop-filter: blur(12px);
            box-shadow: 0 8px 22px rgba(0,0,0,.34);
        }
        .quick-view-switcher[hidden] { display: none; }
        .quick-view-switcher__mode {
            flex: 1;
            min-width: 0;
            min-height: 36px;
            padding: 0 8px;
            border: 0;
            border-radius: 999px;
            color: inherit;
            background: transparent;
            font: 600 12px/1 system-ui, sans-serif;
            cursor: pointer;
            touch-action: manipulation;
        }
        .quick-view-switcher__mode[aria-current="page"] {
            color: #fff;
            background: rgba(255,255,255,.15);
            box-shadow: inset 0 -2px #93c5fd;
        }
        .quick-view-switcher__mode:focus-visible {
            outline: 2px solid #93c5fd;
            outline-offset: -2px;
        }
'''
          replace_once(old_css, new_css, 'quick-nav CSS')

          old_nav = '''    <nav id="submode-footer" class="submode-footer" aria-label="Image view" hidden>
        <button class="submode-footer__mode" type="button" data-submode="focus">Focus</button>
        <button class="submode-footer__mode" type="button" data-submode="explore">Explore</button>
        <button class="submode-footer__mode" type="button" data-submode="table">Table</button>
        <span class="submode-footer__separator" aria-hidden="true"></span>
        <button class="submode-footer__exit" type="button" aria-label="Exit to Sort" title="Exit to Sort">×</button>
    </nav>'''
          new_nav = '''    <nav id="submode-footer" class="quick-view-switcher" aria-label="Quick view switcher" hidden>
        <button class="quick-view-switcher__mode" type="button" data-submode="sort">Sort</button>
        <button class="quick-view-switcher__mode" type="button" data-submode="focus">Focus</button>
        <button class="quick-view-switcher__mode" type="button" data-submode="explore">Explore</button>
        <button class="quick-view-switcher__mode" type="button" data-submode="table">Table</button>
    </nav>'''
          replace_once(old_nav, new_nav, 'quick-nav markup')

          replace_once(
              'aria-label="Focus mode. Left/right review halves. Use the footer to change mode or exit to Sort." hidden>',
              'aria-label="Focus mode. Left/right review halves. Double tap center for Sort; tap footer for views." hidden>',
              'focus navigation aria label'
          )

          mode_navigation = '''        const ModeNavigation = {
            mode: null,
            entry: null,
            switcherOpen: false,
            footerTrigger: null,

            init() {
                const root = Utils.elements.submodeFooter;
                this.footerTrigger = Utils.elements.appContainer?.querySelector('.app-footer') || null;

                root?.addEventListener('click', event => {
                    event.stopPropagation();
                    const option = event.target.closest('[data-submode]');
                    if (option) this.switchTo(option.dataset.submode);
                });

                if (this.footerTrigger) {
                    this.footerTrigger.setAttribute('role', 'button');
                    this.footerTrigger.setAttribute('tabindex', '0');
                    this.footerTrigger.setAttribute('aria-label', 'Choose view');
                    this.footerTrigger.setAttribute('aria-expanded', 'false');
                    this.footerTrigger.addEventListener('click', event => {
                        event.stopPropagation();
                        this.toggleSwitcher();
                    });
                    this.footerTrigger.addEventListener('keydown', event => {
                        if (event.key !== 'Enter' && event.key !== ' ') return;
                        event.preventDefault();
                        this.toggleSwitcher();
                    });
                }

                document.addEventListener('click', event => {
                    if (!this.switcherOpen) return;
                    if (root?.contains(event.target) || this.footerTrigger?.contains(event.target)) return;
                    this.closeSwitcher();
                });

                document.addEventListener('keydown', event => {
                    if (event.key === 'Escape' && this.switcherOpen) {
                        event.preventDefault();
                        this.closeSwitcher();
                    }
                });

                this.syncButtons();
            },

            currentView() {
                if (this.mode) return this.mode;
                return state.isFocusMode ? 'focus' : 'sort';
            },

            syncButtons() {
                const root = Utils.elements.submodeFooter;
                const current = this.currentView();
                root?.querySelectorAll('[data-submode]').forEach(button => {
                    if (button.dataset.submode === current) button.setAttribute('aria-current', 'page');
                    else button.removeAttribute('aria-current');
                });
            },

            openSwitcher() {
                const root = Utils.elements.submodeFooter;
                if (!root) return;
                this.syncButtons();
                root.hidden = false;
                this.switcherOpen = true;
                this.footerTrigger?.setAttribute('aria-expanded', 'true');
            },

            closeSwitcher() {
                const root = Utils.elements.submodeFooter;
                if (root) root.hidden = true;
                this.switcherOpen = false;
                this.footerTrigger?.setAttribute('aria-expanded', 'false');
            },

            toggleSwitcher() {
                if (this.switcherOpen) this.closeSwitcher();
                else this.openSwitcher();
            },

            selected() {
                if (this.mode === 'table') return { stackName: PhotoTable.stackName, fileId: PhotoTable.currentFileId };
                if (this.mode === 'explore') return { stackName: state.currentStack, fileId: SpatialGallery.files[SpatialGallery.selectedIndex]?.id };
                return { stackName: state.currentStack, fileId: state.stacks[state.currentStack]?.[state.currentStackPosition]?.id };
            },

            show(mode) {
                if (!this.entry) this.entry = this.selected();
                this.mode = mode;
                this.syncButtons();
                this.closeSwitcher();
            },

            hide() {
                this.closeSwitcher();
                this.mode = null;
                this.entry = null;
                this.syncButtons();
            },

            switchTo(mode) {
                if (!mode) return this.closeSwitcher();
                const current = this.currentView();
                this.closeSwitcher();
                if (mode === current) return;
                if (mode === 'sort') return this.exit();

                const selection = this.selected();
                SpatialGallery.close({ restoreFocus: false });
                PhotoTable.close({ restoreFocus: false });
                state.currentStack = selection.stackName || this.entry?.stackName || state.currentStack;
                const stack = state.stacks[state.currentStack] || [];
                const index = stack.findIndex(file => file.id === (selection.fileId || this.entry?.fileId));
                if (index >= 0) state.currentStackPosition = index;
                state.isFocusMode = mode === 'focus';
                Utils.elements.appContainer.classList.toggle('focus-mode', state.isFocusMode);
                Gestures.updateGestureOverlayMode();

                if (mode === 'focus') {
                    this.show('focus');
                    Core.updateImageCounters();
                    Core.displayCurrentImage();
                } else if (mode === 'table') {
                    PhotoTable.open({ stackName: state.currentStack, fileId: stack[state.currentStackPosition]?.id });
                } else if (mode === 'explore') {
                    SpatialGallery.open({ stackName: state.currentStack, fileId: stack[state.currentStackPosition]?.id });
                }
            },

            exit() {
                this.closeSwitcher();
                if (this.currentView() === 'sort') return;
                const selection = this.selected();
                returnSpatialModeToSort({
                    stackName: selection.stackName || this.entry?.stackName,
                    fileId: selection.fileId || this.entry?.fileId
                });
            }
        };'''

          pattern = re.compile(r"        const ModeNavigation = \{.*?^        \};\n\n        let spatialReturnInProgress", re.S | re.M)
          replacement = mode_navigation + '\n\n        let spatialReturnInProgress'
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'ModeNavigation replacement: expected 1 match, found {count}')

          provider_version_count = text.count('Orbital8-O-2025-10-12 09:30 AM · v9')
          if provider_version_count != 2:
              raise SystemExit(f'provider/folder version: expected 2 matches, found {provider_version_count}')
          text = text.replace('Orbital8-O-2025-10-12 09:30 AM · v9', 'Orbital8-O-2025-10-12 09:30 AM · v9.1')

          baseline_count = text.count('Orbital8 UI · v1 baseline')
          if baseline_count != 3:
              raise SystemExit(f'baseline version: expected 3 matches, found {baseline_count}')
          text = text.replace('Orbital8 UI · v1 baseline', 'Orbital8 UI · v9.1')

          if text == original:
              raise SystemExit('Patch made no changes')

          required = [
              'class="quick-view-switcher"',
              'data-submode="sort"',
              'toggleSwitcher()',
              "this.footerTrigger.setAttribute('aria-label', 'Choose view')",
              'Double tap center for Sort; tap footer for views.',
              'Orbital8 UI · v9.1'
          ]
          missing = [marker for marker in required if marker not in text]
          if missing:
              raise SystemExit(f'Missing required markers after patch: {missing}')

          if 'class="submode-footer"' in text or 'submode-footer__exit' in text:
              raise SystemExit('Legacy persistent submode footer markup still present')

          path.write_text(text, encoding='utf-8')

      - name: Validate single-file HTML syntax markers
        shell: bash
        run: |
          set -euo pipefail
          test -s ui-v2.html
          grep -q '<!DOCTYPE html>' ui-v2.html
          grep -q 'quick-view-switcher' ui-v2.html
          grep -q 'data-submode="sort"' ui-v2.html
          grep -q 'Orbital8 UI · v9.1' ui-v2.html
          python - <<'PY'
          from pathlib import Path
          text = Path('ui-v2.html').read_text(encoding='utf-8')
          assert text.count('<script>') == text.count('</script>'), 'script tag imbalance'
          assert text.count('<style>') == text.count('</style>'), 'style tag imbalance'
          assert text.count('id="submode-footer"') == 1, 'quick switcher id must be unique'
          print('ui-v2.html structural checks passed')
          PY

      - name: Commit ui-v2 patch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- ui-v2.html; then
            echo 'No ui-v2.html change produced.' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ui-v2.html
          git commit -m 'Implement quick horizontal view switcher'
          git push origin HEAD:main
