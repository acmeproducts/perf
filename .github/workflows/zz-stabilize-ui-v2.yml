name: orbital8-v27-curation-final
on:
  push:
    paths:
      - '.github/workflows/zz-stabilize-ui-v2.yml'
permissions:
  contents: write
jobs:
  build-final:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild v2.7 from approved 18bde15 source
        run: python .github/scripts/orbital-v17-cleanup.py
      - name: Validate curation contract
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only)" = "ui-v2.html"
          grep -Fq "v2.7 curation-final" ui-v2.html
          grep -Fq "orbital8:folder-curation-targets:v2" ui-v2.html
          grep -Fq "state.stacks[state.currentStack]" ui-v2.html
          grep -Fq "TagService.addTag(tag,[fileId])" ui-v2.html
          grep -Fq "Grid._curationOrigin" ui-v2.html
          grep -Fq "payload.curationInspection" ui-v2.html
          grep -Fq "payload.gridOrigin" ui-v2.html
          grep -Fq "#photo-table-stacks { display:none !important; }" ui-v2.html
          grep -Fq "FlingFX.trail('table'" ui-v2.html
          grep -Fq "FlingFX.trail('explore'" ui-v2.html
          grep -Fq "bottom:44px" ui-v2.html
          ! grep -Fq "favorite.textContent='♥'" ui-v2.html
          ! grep -Fq "this.resolveMovingCollisionsV14();" ui-v2.html
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('ui-v2.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,re.S)
          Path('/tmp/orbital-final.js').write_text('\n'.join(scripts),encoding='utf-8')
          assert "Orbital8 UI · v2.7 curation-final" in text
          assert "const VERSION='v2.7 curation-final';" in text
          PY
          node --check /tmp/orbital-final.js
      - name: Commit final application
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ui-v2.html
          test "$(git diff --cached --name-only)" = "ui-v2.html"
          git commit -m 'Build Orbital8 v2.7 curation final'
          git push origin HEAD:main
