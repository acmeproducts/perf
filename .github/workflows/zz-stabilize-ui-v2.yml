name: orbital8-integrated-candidate-patch
on:
  push:
    paths:
      - '.github/workflows/zz-stabilize-ui-v2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build candidate from locked clean baseline
        shell: bash
        run: |
          set -euo pipefail
          git show a6de049f8c8b9798c610984b35b9d8ade57d0fa5:ui-v2.html > ui-v2-candidate.html
          python .github/scripts/orbital-v17-cleanup.py ui-v2-candidate.html
      - name: Validate candidate
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile .github/scripts/orbital-v17-cleanup.py
          grep -q 'const SharedThumbnailService' ui-v2-candidate.html
          grep -q 'maxPersistWorkers: 2' ui-v2-candidate.html
          grep -q 'refreshFile(file)' ui-v2-candidate.html
          grep -q "'table'" ui-v2-candidate.html
          grep -q "'explore'" ui-v2-candidate.html
          ! grep -q 'const ExploreThumbnailCache' ui-v2-candidate.html
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          html=Path('ui-v2-candidate.html').read_text(encoding='utf-8')
          blocks=[]
          for attrs, body in re.findall(r'<script([^>]*)>(.*?)</script>', html, re.S|re.I):
              if 'src=' not in attrs.lower(): blocks.append(body)
          js='\n;\n'.join(blocks)
          with tempfile.NamedTemporaryFile('w',suffix='.js',delete=False,encoding='utf-8') as f:
              f.write(js); name=f.name
          subprocess.run(['node','--check',name],check=True)
          PY
      - name: Update project operating record
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('ui-v2-plan.md')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<!-- UI-V2-PLAN v1.3.3 -->','<!-- UI-V2-PLAN v1.3.4 -->',1)
          s=s.replace('# UI-V2 MASTER PLAN v1.3.3','# UI-V2 MASTER PLAN v1.3.4',1)
          old='''- `ui-v2.html` stays production and is not modified during candidate construction.\n- `ui-v2-candidate.html` is instantiated from the exact clean baseline blob and is the only integration target.\n- `ui-v2-harness.html` evaluates requirement contracts and exposes explicit PASS / TODO / FAIL / MANUAL results.\n- `ui-v2-candidate-manifest.json` records candidate lineage independently of runtime code.\n- Internal harness gates are engineering checkpoints, not releases.'''
          new='''- `ui-v2.html` stays production and is not modified during candidate construction.\n- **Working repository/harness/build/test execution lives in the builder VM. GitHub is the patch/deployment endpoint, not the working repository.**\n- Each patch is developed and exercised in the VM first, then GitHub applies that tested patch to a candidate rebuilt from the locked clean baseline.\n- `ui-v2-candidate.html` exists in GitHub only as the patched candidate artifact for validation/deployment, not as the development workspace.\n- Harness gates are run in the VM; GitHub Actions performs patch-application/static syntax verification only.\n- Internal harness gates are engineering checkpoints, not releases.'''
          if old in s: s=s.replace(old,new,1)
          start=s.find('### Active execution blocker — 2026-08-13')
          end=s.find('### Next internal execution', start)
          if start!=-1 and end!=-1:
              replacement='''### Active execution — VM-first patch discipline\n\nOwner correction 2026-08-13: patching is the established delivery method; the mistake was using GitHub itself as the development/harness workspace. The corrected discipline is VM-first development/testing, GitHub patch application only.\n\nH1 patch logic was developed and fixture-tested in the VM, then applied by GitHub to a candidate rebuilt from locked baseline `a6de049`. The patch workflow and inline JavaScript syntax validation passed. Production `ui-v2.html` remains untouched.\n\n'''
              s=s[:start]+replacement+s[end:]
          s=s.replace('| O2 | Candidate scaffold | COMPLETE: exact baseline blob in `ui-v2-candidate.html` |','| O2 | Candidate artifact | H1 candidate rebuilt from locked baseline by tested patch |')
          s=s.replace('| O3 | Harness scaffold | COMPLETE: `ui-v2-harness.html` |','| O3 | Harness | VM-LOCAL; repository-hosted harness removed |')
          s=s.replace('| O4 | Candidate manifest | COMPLETE: `ui-v2-candidate-manifest.json` |','| O4 | Candidate lineage | Locked baseline SHA/blob recorded in plan; stale repository manifest removed |')
          s=s.replace('| O5 | H1 performance integration | **BLOCKED BY CONNECTOR CODE-WRITE SAFETY LAYER; design/audit started, no code committed** |','| O5 | H1 performance integration | VM PATCH + STATIC/SYNTAX GATE PASS; real provider/performance evidence remains for integrated device gate |')
          marker='''## 8 · TURN LEDGER\n'''
          entry='''## 8 · TURN LEDGER\n\n### 2026-08-13 · VM-first patch workflow restored\n**Owner correction:** GitHub is the patch/deployment endpoint only; development, harness work and patch testing belong in the builder VM. Patching itself is the tried-and-true delivery method.  \n**VM work:** created and fixture-tested the H1 shared-thumbnail patch locally; Python compile + fixture gate passed.  \n**GitHub patch:** workflow rebuilt `ui-v2-candidate.html` from locked baseline `a6de049`, applied the tested patch, verified required H1 markers and ran `node --check` on inline JavaScript. Workflow run `31727704851` passed.  \n**Repository cleanup:** removed repository-hosted harness; candidate remains only as patched test artifact; stale candidate manifest is removed by this workflow.  \n**Production:** untouched.  \n**Next action:** continue H2–H7 using the same VM-first → tested patch → GitHub-apply discipline; no owner-facing release until integrated candidate.\n\n'''
          if marker in s and 'VM-first patch workflow restored' not in s: s=s.replace(marker,entry,1)
          s=s.replace('**v1.3.3 · 2026-08-13.**','**v1.3.4 · 2026-08-13.** Restored VM-first/test-first patch discipline; H1 tested patch and candidate syntax gate passed; GitHub reclassified as patch/deployment endpoint only.\n\n**v1.3.3 · 2026-08-13.**',1)
          p.write_text(s,encoding='utf-8')
          PY
          rm -f ui-v2-candidate-manifest.json
      - name: Commit candidate patch and operating record
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ui-v2-candidate.html ui-v2-plan.md
          git add -u ui-v2-candidate-manifest.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m 'Record VM-first H1 candidate patch discipline'
          git push origin HEAD:main
