name: orbital8-owner-correction-release
on:
  push:
    paths: ['.github/workflows/zz-stabilize-ui-v2.yml']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Build and gate corrected production
        shell: bash
        run: |
          set -euo pipefail
          git show 45fa45dea68107f5400abfbaddb855b54b64bedd:ui-v2.html > ui-v2-next.html
          python .github/scripts/orbital-v17-cleanup.py ui-v2-next.html
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          h=Path('ui-v2-next.html').read_text()
          def c(n,v): print(('PASS' if v else 'FAIL'),n); assert v,n
          sm='<style id="orbital8-v21-owner-corrections-css">'; jm='<script id="orbital8-v21-owner-corrections">'
          si=h.rfind(sm); ji=h.rfind(jm); fb=h.rfind('</body>'); donor=max(h.rfind('orbital8-v20-shared-image-service'),h.rfind('orbital8-v20-inspection-tags-grid-resume'))
          c('placement',si>donor and ji>si and fb>ji and si>int(len(h)*.8))
          c('A1',all(x in h for x in ['id="focus-stack-name"','id="focus-image-count"','id="focus-favorite-btn"','id="focus-delete-btn"','id="details-button"']))
          c('A2',"defaults:['YES','MAYBE','NO']" in h and 'FolderTagTargets.values().length === 3' in h)
          c('A3','FolderTagTargets.rename' in h and 'enableDraggableTagHost' in h and 'saveTargetOrder' in h)
          c('A4',':folderTagTargets:${state.providerType' in h and '${state.currentFolder?.id' in h)
          c('A5','PhotoTable.open=function(options={})' in h and "StackSelectorV2.open('table')" in h)
          c('A6',"InspectionV2.open('explore'" in h and "if(this.inspectionLevel==='large'){this.setLevel('medium')" in h)
          c('A7',not re.findall(r'<button(?=[^>]*class="spatial-gallery__destination)',h,re.I) and 'SpatialGallery.destinationFor = () => null' in h)
          c('A8','PhotoTable.flingToTag' in h and "InspectionV2.open('table'" in h)
          c('A9','orbital-inspection-rail prev' in h and 'orbital-inspection-rail next' in h and 'InspectionV2.navigate' in h)
          c('A10',"this.root.classList.toggle('large'" in h and 'body.orbital-inspecting #focus-favorite-btn' in h)
          c('A11','openTagGrid(tag)' in h and 'state.grid.tagFilter=normalizedTag' in h)
          c('A12','orbital-stack-row__grid' in h and 'async openGrid(stackName)' in h and 'Grid.open(stackName)' in h)
          c('A13',"gridExit: 'sort'" in h and 'await forceSortSurface()' in h and 'inspectionLevel:' in h)
          c('A14','window.OrbitalImageCache = OrbitalImageCache' in h and 'Utils.setImageSrc = async' in h)
          c('A15','repairVisible' in h and 'visibilitychange' in h and 'OrbitalImageCache.attach' in h)
          c('A16','payload.surface=' in h and 'payload.inspectionLevel=' in h and 'payload.gridOrigin=' in h)
          c('A17','@media(min-width:900px)' in h and '#center-trash-btn{bottom:max(76px' in h)
          c('A18','id="spatial-gallery-delete"' not in h and not re.findall(r'<button(?=[^>]*data-table-stack="[^"]+")',h,re.I))
          c('owner Explore nav/comets','orbital-explore-rail prev' in h and 'spawnTouchFeedback' in h and 'comet-trail' in h)
          c('owner Explore hot path','card.element.style.filter = `blur(' not in h)
          c('owner Table collisions',"PhotoTable.paint=function(photo)" in h and 'pushLeft' in h)
          c('owner draggable tags','orbital-dragging' in h and 'InspectionV2.openTagGrid(tag)' in h)
          start=ji+len(jm); end=h.index('</script>',start)
          with tempfile.NamedTemporaryFile('w',suffix='.js',delete=False) as f: f.write(h[start:end]); n=f.name
          subprocess.run(['node','--check',n],check=True)
          print('PASS owner JS syntax')
          PY
      - name: Publish and clean temporary machinery
        shell: bash
        run: |
          set -euo pipefail
          cp ui-v2-next.html ui-v2.html
          python - <<'PY'
          from pathlib import Path
          p=Path('ui-v2-plan.md'); s=p.read_text()
          e='''\n\n### 2026-08-13 · Owner correction placement revalidation\nPost-publication verification caught that the preceding owner-correction release inserted at a literal `</body>` inside the Sync Activity Log template. That release is superseded. This replacement is rebuilt again from clean-lineage commit `45fa45dea68107f5400abfbaddb855b54b64bedd`, inserts before the document-final `</body>`, and gates placement after the v2.0 donor layers. A1-A18, all owner-reported regression checks, placement, and owner-correction JavaScript syntax PASS before publication.\n'''
          if '### 2026-08-13 · Owner correction placement revalidation' not in s: s+=e
          p.write_text(s)
          PY
          rm -f ui-v2-next.html
          git rm .github/scripts/orbital-v17-cleanup.py .github/workflows/zz-stabilize-ui-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ui-v2.html ui-v2-plan.md
          git commit -m 'fix: place UI-V2 owner corrections at document tail'
          git push origin HEAD:main
