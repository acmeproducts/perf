name: orbital8-integrated-candidate-patch
on:
  push:
    paths:
      - '.github/workflows/zz-stabilize-ui-v2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build candidate from locked clean baseline
        shell: bash
        run: |
          set -euo pipefail
          git show a6de049f8c8b9798c610984b35b9d8ade57d0fa5:ui-v2.html > ui-v2-candidate.html
          python .github/scripts/orbital-v17-cleanup.py ui-v2-candidate.html
      - name: Validate candidate
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile .github/scripts/orbital-v17-cleanup.py
          grep -q 'const SharedThumbnailService' ui-v2-candidate.html
          grep -q 'maxPersistWorkers: 2' ui-v2-candidate.html
          grep -q 'refreshFile(file)' ui-v2-candidate.html
          grep -q "'table'" ui-v2-candidate.html
          grep -q "'explore'" ui-v2-candidate.html
          ! grep -q 'const ExploreThumbnailCache' ui-v2-candidate.html
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          html=Path('ui-v2-candidate.html').read_text(encoding='utf-8')
          blocks=[]
          for attrs, body in re.findall(r'<script([^>]*)>(.*?)</script>', html, re.S|re.I):
              if 'src=' not in attrs.lower(): blocks.append(body)
          js='\n;\n'.join(blocks)
          with tempfile.NamedTemporaryFile('w',suffix='.js',delete=False,encoding='utf-8') as f:
              f.write(js); name=f.name
          subprocess.run(['node','--check',name],check=True)
          PY
      - name: Finalize plan state
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('ui-v2-plan.md')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<!-- UI-V2-PLAN v1.3.4 -->','<!-- UI-V2-PLAN v1.3.5 -->',1)
          s=s.replace('# UI-V2 MASTER PLAN v1.3.4','# UI-V2 MASTER PLAN v1.3.5',1)
          s=s.replace('**Harness:** `ui-v2-harness.html`  \n','')
          s=s.replace('**Candidate manifest:** `ui-v2-candidate-manifest.json`  \n','')
          old='''1. Retired the eight owner-facing release sequence.\n2. Created `ui-v2-harness.html` as the single requirements dashboard.\n3. Instantiated `ui-v2-candidate.html` from the exact clean baseline blob from `a6de049`, not current production and not a later damaged snapshot.\n4. Created `ui-v2-candidate-manifest.json` recording baseline commit/blob and integration status.\n5. Published the item-by-item A1-A18 audit as `UI-V2-REQUIREMENTS-AUDIT-2026-08-13.md`.\n6. Production `ui-v2.html` was not modified by the audit turn.'''
          new='''1. Retired the eight owner-facing release sequence.\n2. Locked clean baseline `a6de049` and requirements audit A1-A18.\n3. Restored VM-first development/test discipline; repository-hosted harness/manifest artifacts were removed.\n4. Developed and fixture-tested H1 patch logic in the VM.\n5. GitHub patch workflow rebuilt `ui-v2-candidate.html` from locked baseline and applied H1.\n6. H1 static markers and inline JavaScript syntax gate passed.\n7. Production `ui-v2.html` remains untouched.'''
          if old in s: s=s.replace(old,new,1)
          s=s.replace('**Candidate is NOT owner-testable yet.** It is still in integration. The clean baseline audit is PASS 1; PARTIAL/PARTIAL-FAIL 6; FAIL/FAIL-OPPOSITE 11. These are baseline findings, not claims about completed candidate behavior.','**Candidate is NOT owner-testable yet.** H1 code is integrated and static/syntax validation is green; H2-H7 remain internal work. Real provider/performance evidence stays explicit for the final integrated device gate.',1)
          oldnext='''1. Resume H1 through a working repository code-write path.\n2. Replace the URL-keyed Explore/Table cache precursor with one file-identity keyed shared thumbnail service.\n3. Add visible-first loading, bounded background persistence, cache/request/refetch instrumentation and Drive recovery by file identity.\n4. Run H1 harness checks and capture real provider measurements.\n5. Continue H2–H7 internally in the same candidate.\n6. Present only the H8-integrated candidate to the owner.'''
          newnext='''1. Continue H2 inspection/Focus-chrome work in the VM, then apply the tested patch to the same candidate lineage.\n2. Continue H3-H7 internally using the same VM-first → tested patch → GitHub-apply method.\n3. Keep H1 real-provider/expiry measurements explicit and collect them at the final integrated gate rather than creating an owner-facing H1 release.\n4. Present only the fully integrated H8 candidate to the owner.'''
          if oldnext in s: s=s.replace(oldnext,newnext,1)
          s=s.replace('**v1.3.4 · 2026-08-13.**','**v1.3.5 · 2026-08-13.** Removed stale repository-harness/manifest references, recorded H1 static/syntax PASS, and advanced internal execution to H2.\n\n**v1.3.4 · 2026-08-13.**',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit candidate and plan
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ui-v2-candidate.html ui-v2-plan.md
          git diff --cached --quiet && exit 0
          git commit -m 'Advance integrated candidate from H1 to H2'
          git push origin HEAD:main
