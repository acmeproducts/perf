name: orbital8-v17-cleanup
on:
  push:
    paths:
      - '.github/workflows/zz-stabilize-ui-v2.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply v1.7 cleanup
        run: python .github/scripts/orbital-v17-cleanup.py
      - name: Validate
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only)" = "ui-v2.html"
          grep -q "v1.7 clean-table-explore" ui-v2.html
          grep -q "const targetLabels={priority:'YES',out:'MAYBE',trash:'NO'}" ui-v2.html
          grep -q "originalFlingTrailV17" ui-v2.html
          ! grep -q "this.resolveMovingCollisionsV14();" ui-v2.html
          ! grep -q "orbital8-v16-standard-chrome-script" ui-v2.html
          ! grep -q "orbital8-v161-stable-chrome-script" ui-v2.html
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('ui-v2.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,re.S)
          Path('/tmp/orbital-all.js').write_text('\n'.join(scripts),encoding='utf-8')
          assert "const targetLabels={priority:'YES',out:'MAYBE',trash:'NO'};" in text
          assert "return [...(state.stacks.in||[])]" in text
          assert "body.orbital-explore-inspecting #focus-stack-name" in text
          assert "body.orbital-table-standard #focus-stack-name" in text
          PY
          node --check /tmp/orbital-all.js
      - name: Commit application file only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ui-v2.html
          test "$(git diff --cached --name-only)" = "ui-v2.html"
          git commit -m 'Clean Explore chrome and Table triage physics'
          git push origin HEAD:main
