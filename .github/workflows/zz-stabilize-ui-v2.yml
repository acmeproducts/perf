name: orbital8-rollback-to-18bde15
on:
  push:
    paths:
      - '.github/workflows/zz-stabilize-ui-v2.yml'
permissions:
  contents: write
jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore approved application and builder
        run: |
          set -euo pipefail
          git show 18bde1535fa3af41e1421ec6376d34616ede48fc:ui-v2.html > ui-v2.html
          git show 18bde1535fa3af41e1421ec6376d34616ede48fc:.github/scripts/orbital-v17-cleanup.py > .github/scripts/orbital-v17-cleanup.py
      - name: Commit rollback
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ui-v2.html .github/scripts/orbital-v17-cleanup.py
          git diff --cached --quiet && exit 0
          git commit -m 'Restore Orbital8 UI to 18bde15 baseline'
          git push origin HEAD:main
