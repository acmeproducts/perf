name: orbital8-v27-curation-final
on:
  push:
    paths:
      - '.github/workflows/zz-stabilize-ui-v2.yml'
permissions:
  contents: write
jobs:
  build-final:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild v2.7 from approved 18bde15 source
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/scripts/orbital-v17-cleanup.py')
          s=p.read_text(encoding='utf-8')
          start=s.index("scripts=re.findall(r'<script")
          end=s.index("PATH.write_text(text,encoding='utf-8')", start)
          s=s[:start]+s[end:]
          old="text=text.replace('</body>',integration+'\\n</body>',1)"
          new="head, tail = text.rsplit('</body>', 1)\ntext = head + integration + '\\n</body>' + tail"
          if old not in s:
              raise SystemExit('body injection marker missing')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          python .github/scripts/orbital-v17-cleanup.py
      - name: Commit final application
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ui-v2.html
          git commit -m 'Build Orbital8 v2.7 curation final'
          git push origin HEAD:main
