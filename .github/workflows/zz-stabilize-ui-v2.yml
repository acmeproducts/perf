name: orbital8-v18-focus-standard
on:
  push:
    paths:
      - '.github/workflows/zz-stabilize-ui-v2.yml'
permissions:
  contents: write
jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply corrected v1.8 source refinement
        run: python .github/scripts/orbital-v17-cleanup.py
      - name: Validate requirements
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only)" = "ui-v2.html"
          grep -Fq "v1.8 focus-standard" ui-v2.html
          grep -Fq "const targetLabels={priority:'YES',out:'MAYBE',trash:'NO'}" ui-v2.html
          grep -Fq "return [...(state.stacks.in||[])]" ui-v2.html
          grep -Fq "body.orbital-explore-active #focus-stack-name" ui-v2.html
          grep -Fq "body.orbital-table-standard #focus-stack-name" ui-v2.html
          grep -Fq ".photo-table .comet-trail" ui-v2.html
          grep -Fq 'aria-label="Back to medium inspection"' ui-v2.html
          ! grep -Fq "favorite.textContent='♥'" ui-v2.html
          ! grep -Fq "classList.toggle('expanded')" ui-v2.html
          ! grep -Fq "this.resolveMovingCollisionsV14();" ui-v2.html
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('ui-v2.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,re.S)
          Path('/tmp/orbital-all.js').write_text('\n'.join(scripts),encoding='utf-8')
          assert text.count("const VERSION = 'v1.8 focus-standard';") == 1
          assert "document.body.classList.add('orbital-explore-active')" in text
          assert "document.body.classList.add('orbital-table-standard')" in text
          assert "tableTargetGeometryV14().filter(target => target.el.dataset.tablePile !== 'in'" in text
          PY
          node --check /tmp/orbital-all.js
      - name: Commit application file only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ui-v2.html
          test "$(git diff --cached --name-only)" = "ui-v2.html"
          git commit -m 'Standardize Explore and Table UI v1.8'
          git push origin HEAD:main
