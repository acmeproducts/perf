name: temporary-orbital-v15-triage-table

on:
  push:
    paths:
      - '.github/workflows/zz-orbital-v15-triage-table.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Insert v1.5 patch
        shell: python
        run: |
          from pathlib import Path
          import base64,gzip,hashlib
          payload=''''''
          fragment=gzip.decompress(base64.b64decode(payload)).decode('utf-8')
          expected='36da97e47b04dc0789ba7f61f8c75974e0ed24ee664f4f198cc4c522c93669b1'
          if hashlib.sha256(fragment.encode()).hexdigest()!=expected:
              raise SystemExit('payload sha mismatch')
          path=Path('ui-v2.html')
          text=path.read_text(encoding='utf-8')
          if 'orbital8-v15-triage-table-script' in text:
              raise SystemExit('v1.5 already present')
          idx=text.rfind('</body>')
          if idx<0: raise SystemExit('closing body not found')
          path.write_text(text[:idx]+fragment+text[idx:],encoding='utf-8')
      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only)" = "ui-v2.html"
          grep -q 'orbital8-v15-triage-table-script' ui-v2.html
          grep -q 'SwitcherShieldV15' ui-v2.html
          grep -q 'triageFilesV15' ui-v2.html
          grep -q "v1.5 triage-table" ui-v2.html
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('ui-v2.html').read_text(encoding='utf-8')
          m=re.search(r'<script id="orbital8-v15-triage-table-script">\n(.*?)\n</script>',text,re.S)
          assert m
          Path('/tmp/v15.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/v15.js
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ui-v2.html
          test "$(git diff --cached --name-only)" = "ui-v2.html"
          git commit -m 'Simplify Table triage and shield quick switcher'
          git push origin HEAD:main
