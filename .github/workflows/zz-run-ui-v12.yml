name: run-ui-v2-v12-patch

on:
  push:
    paths:
      - '.github/workflows/zz-run-ui-v12.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply v1.2 patch
        run: |
          python scripts/apply_ui_v12.py
          git diff --check
          grep -q 'Orbital8 v1.2 table/cache interaction patch' ui-v2.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ui-v2.html
          git commit -m 'Fix thumbnail caching and rebuild Table interactions'
          git push origin HEAD:main
