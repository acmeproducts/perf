name: temporary-ui-v2-r48-executor
"on":
  push:
    paths:
      - ".github/workflows/zz-ui-v2-r48-executor.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-v2-reconstruction
          fetch-depth: 0
      - name: Apply scoped Explore anchor repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('ui-v2.html')
          text = path.read_text(encoding='utf-8')
          original = text

          text, count = re.subn(
              r"\n            promoteFileId\(fileId, stackName = state\.currentStack\) \{.*?\n            \},\n\n            activateFileId\(",
              "\n            activateFileId(",
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'promoteFileId removal: expected 1 match, found {count}')

          old = '''                const promotion = this.promoteFileId(file.id, state.currentStack);
                if (!promotion) return false;
                const promotedIndex = this.files.findIndex(item => String(item.id) === requestedId);
                this.select(Math.max(0, promotedIndex));
                if (!CurrentImage.assert(file.id, 'Explore thumbnail activation')) return false;'''
          new = '''                // Explore selection is a view anchor only. It must never mutate normal-stack order or stackSequence.
                this.select(index);
                if (!CurrentImage.assert(file.id, 'Explore thumbnail activation')) return false;'''
          if text.count(old) != 1:
              raise SystemExit(f'activateFileId promotion block: expected 1 match, found {text.count(old)}')
          text = text.replace(old, new, 1)

          text = text.replace(
              '<!-- Orbital8 UI governed reconstruction · R4.7 exact Explorer anchoring and reconciled Table counts -->',
              '<!-- Orbital8 UI governed reconstruction · R4.8 stable Explore anchor without stack reorder -->',
              1,
          )

          if text == original:
              raise SystemExit('repair made no changes')
          forbidden = ['promoteFileId(', "origin: 'explore:activate'", 'state.stacks[stackName] = rotated']
          present = [marker for marker in forbidden if marker in text]
          if present:
              raise SystemExit(f'forbidden Explore reorder markers remain: {present}')
          if 'this.select(index);' not in text:
              raise SystemExit('exact fileId selection anchor missing')
          if not text.rstrip().endswith('</html>'):
              raise SystemExit('HTML completeness check failed')

          path.write_text(text, encoding='utf-8')
          PY

          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('ui-v2.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, re.S)
          inline = [s for s in scripts if s.strip()]
          if not inline:
              raise SystemExit('no inline JavaScript found')
          Path('/tmp/ui-v2-inline.js').write_text(inline[-1], encoding='utf-8')
          PY

          node --check /tmp/ui-v2-inline.js
          git diff --check
          grep -q "R4.8 stable Explore anchor without stack reorder" ui-v2.html
          ! grep -q "promoteFileId(" ui-v2.html
          ! grep -q "origin: 'explore:activate'" ui-v2.html
          ! grep -q "state.stacks\[stackName\] = rotated" ui-v2.html

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui-v2.html
          git commit -m "R4.8 stop Explore taps from reordering stacks"
          git push origin HEAD:ui-v2-reconstruction