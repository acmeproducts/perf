name: temporary-ui-v2-r48-executor

"on":
  pull_request:
    branches: [main]
    paths: [".github/r48-trigger"]
permissions:
  contents: write
jobs:
  repair-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-v2-reconstruction
          fetch-depth: 0
      - name: Apply verify commit publish R4.8
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:ui-v2.html)" = "5b753ed5539948409bf16a723c9f55f23f0deaa7"
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('ui-v2.html'); t=p.read_text(encoding='utf-8')
          old='<!-- Orbital8 UI governed reconstruction · R4.7 exact Explorer anchoring and reconciled Table counts -->'
          new='<!-- Orbital8 UI governed reconstruction · R4.8 stable Explore anchor without stack reorder -->'
          if t.count(old)!=1: raise SystemExit('build marker mismatch')
          t=t.replace(old,new,1)
          t,n=re.subn(r"\n            promoteFileId\(fileId, stackName = state\.currentStack\) \{.*?\n            \},\n\n            activateFileId\(","\n            activateFileId(",t,count=1,flags=re.S)
          if n!=1: raise SystemExit(f'helper removal {n}')
          pat=re.compile(r"(?P<i>[ \t]*)const promotion = this\.promoteFileId\(file\.id, state\.currentStack\);\s*\n(?P=i)if \(!promotion\) return false;\s*\n(?P=i)const promotedIndex = this\.files\.findIndex\(item => String\(item\.id\) === requestedId\);\s*\n(?P=i)this\.select\(Math\.max\(0, promotedIndex\)\);")
          def repl(m):
              i=m.group('i'); return i+'// Explore selection is a view anchor only. It must never mutate normal-stack order or stackSequence.\n'+i+'this.select(index);'
          t,n=pat.subn(repl,t,count=1)
          if n!=1: raise SystemExit(f'activation replacement {n}')
          if 'promoteFileId(' in t or "origin: 'explore:activate'" in t: raise SystemExit('reorder path remains')
          if not t.rstrip().endswith('</html>'): raise SystemExit('incomplete html')
          p.write_text(t,encoding='utf-8')
          PY
          python - <<'PY'
          from pathlib import Path
          import re
          t=Path('ui-v2.html').read_text(encoding='utf-8'); s=[x for x in re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',t,re.S) if x.strip()]
          Path('/tmp/ui-v2-inline.js').write_text(s[-1],encoding='utf-8')
          PY
          node --check /tmp/ui-v2-inline.js
          git diff --check -- ui-v2.html
          grep -q "R4.8 stable Explore anchor without stack reorder" ui-v2.html
          ! grep -q "promoteFileId(" ui-v2.html
          ! grep -q "origin: 'explore:activate'" ui-v2.html
          grep -q "this.select(index);" ui-v2.html
          grep -q "CurrentImage.assert(file.id, 'Explore thumbnail activation')" ui-v2.html
          grep -q "pressedFileId" ui-v2.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui-v2.html
          git commit -m "R4.8 stable Explore anchor without stack reorder"
          RECON_COMMIT=$(git rev-parse HEAD); R48_BLOB=$(git rev-parse HEAD:ui-v2.html)
          cp ui-v2.html /tmp/ui-v2-r48.html
          git push origin HEAD:ui-v2-reconstruction
          git fetch origin main
          git checkout -B main origin/main
          cp /tmp/ui-v2-r48.html ui-v2.html
          git add ui-v2.html
          git diff --check --cached
          test "$(git hash-object ui-v2.html)" = "$R48_BLOB"
          git commit -m "Publish R4.8 stable Explore anchor"
          MAIN_COMMIT=$(git rev-parse HEAD)
          git push origin HEAD:main
          echo "R4.8_RECON_COMMIT=$RECON_COMMIT"
          echo "R4.8_BLOB=$R48_BLOB"
          echo "R4.8_MAIN_COMMIT=$MAIN_COMMIT"
