name: temporary-orbital-v14-inspection-physics

on:
  push:
    paths:
      - '.github/workflows/zz-orbital-v14-inspection-physics.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decode and insert v1.4
        shell: python
        run: |
          from pathlib import Path
          import base64, gzip, hashlib
          payload = ''''''
          fragment = gzip.decompress(base64.b64decode(payload)).decode('utf-8')
          expected = 'de70bcc60ec8538f600dffd11cf79c86b3d4ec63b7d5eb2c743bcf48f253f3bc'
          actual = hashlib.sha256(fragment.encode()).hexdigest()
          if actual != expected:
              raise SystemExit(f'payload sha mismatch: {actual}')
          path = Path('ui-v2.html')
          text = path.read_text(encoding='utf-8')
          marker = 'orbital8-v14-inspection-physics-script'
          if marker in text:
              raise SystemExit('v1.4 already present; refusing duplicate insertion')
          idx = text.rfind('</body>')
          if idx < 0:
              raise SystemExit('closing body not found')
          path.write_text(text[:idx] + fragment + text[idx:], encoding='utf-8')
      - name: Validate v1.4
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = "ui-v2.html"
          grep -q 'orbital8-v14-inspection-physics-script' ui-v2.html
          grep -q 'ExploreInspectV14' ui-v2.html
          grep -q 'resolveMovingCollisionsV14' ui-v2.html
          grep -q "v1.4 inspection-physics" ui-v2.html
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('ui-v2.html').read_text(encoding='utf-8')
          match = re.search(r'<script id="orbital8-v14-inspection-physics-script">\n(.*?)\n</script>', text, re.S)
          assert match, 'embedded v1.4 script missing'
          Path('/tmp/orbital-v14.js').write_text(match.group(1), encoding='utf-8')
          assert text.count('id="orbital8-v14-inspection-physics-script"') == 1
          assert text.count('id="orbital8-v14-inspection-physics-style"') == 1
          PY
          node --check /tmp/orbital-v14.js
      - name: Commit ui-v2.html only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ui-v2.html
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          test "$(git diff --cached --name-only)" = "ui-v2.html"
          git commit -m 'Refine Explore inspection and Table physics'
          git push origin HEAD:main
