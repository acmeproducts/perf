name: temporary-ui-v2-quick-nav
"on":
  push:
    paths:
      - ".github/workflows/zz-ui-v2-quick-nav.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python /tmp/patch.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui-v2.html
          git commit -m "Implement quick horizontal view switcher"
          git push origin HEAD:main
