name: Orbital8 v1.7 source refinement
on:
  push:
    paths:
      - '.github/workflows/refine-v17.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v1.7 refinement
        run: python .github/scripts/refine-v17.py
      - name: Commit refined source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui-v2.html
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "Refine Explore and Table interaction surfaces v1.7"
          git push
