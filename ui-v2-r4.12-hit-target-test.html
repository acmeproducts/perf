<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, maximum-scale=1.0">
  <title>Orbital8 UI · R4.12 Explore hit-target test</title>
</head>
<body>
<script>
(async () => {
  const sourceUrl = `ui-v2.html?r4_12_source=${Date.now()}`;
  const response = await fetch(sourceUrl, { cache: 'no-store' });
  if (!response.ok) throw new Error(`Unable to load canonical ui-v2.html (${response.status})`);
  let source = await response.text();
  const oldBlock = `                    const releaseCard = this.cardAtPoint(event.clientX, event.clientY);\n                    const releasePath = event.composedPath?.() || [];\n                    const stillOnPressedCard = pressedCard && (releaseCard?.element === pressedCard || releasePath.includes(pressedCard));\n                    if (stillOnPressedCard) this.activateFileId(pressedFileId, pressedCard);`;
  const newBlock = `                    const releasePath = event.composedPath?.() || [];\n                    const releaseStack = typeof document.elementsFromPoint === 'function'\n                        ? document.elementsFromPoint(event.clientX, event.clientY)\n                        : [document.elementFromPoint(event.clientX, event.clientY)].filter(Boolean);\n                    const stillOnPressedCard = pressedCard && (\n                        releasePath.includes(pressedCard)\n                        || releaseStack.some(node => node === pressedCard || pressedCard.contains(node))\n                    );\n                    if (stillOnPressedCard) this.activateFileId(pressedFileId, pressedCard);`;
  if (!source.includes(oldBlock)) throw new Error('R4.12 patch anchor no longer matches canonical ui-v2.html');
  source = source.replace(
    '<!-- Orbital8 UI governed reconstruction · R4.10 exact Explore continuity and iPhone usability -->',
    '<!-- Orbital8 UI governed reconstruction · R4.12 exact Explore pointer-release identity test -->'
  );
  source = source.replace(oldBlock, newBlock);
  source = source.replace(
    "const APP_BUILD_ID = 'reconstruction-R4.10-exact-explore-continuity-iphone-usability-2026.08.23.1';",
    "const APP_BUILD_ID = 'reconstruction-R4.12-exact-explore-pointer-release-identity-2026.09.03.1';"
  );
  document.open();
  document.write(source);
  document.close();
})().catch(error => {
  document.body.style.cssText = 'margin:0;padding:24px;background:#111;color:#fff;font:16px -apple-system,BlinkMacSystemFont,sans-serif;white-space:pre-wrap';
  document.body.textContent = `R4.12 test build failed to boot:\n${error.stack || error.message}`;
});
</script>
</body>
</html>
