<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,maximum-scale=1">
<title>Orbital8 UI-V2 coordinate-picking candidate</title>
<body style="margin:0;background:#000;color:#fff;font-family:system-ui,sans-serif"><div id="status" style="padding:20px">Loading validated UI-V2 base…</div><script>
(async()=>{
 const status=document.getElementById('status');
 try{
  const base='https://raw.githubusercontent.com/acmeproducts/perf/a8bb23fd5ec2e29fa5fe72e6492f1556cdd2e0e3/ui-v2.html';
  let html=await (await fetch(base,{cache:'no-store'})).text();
  const oldDown=`                const card = event.target.closest('.spatial-gallery__card');\n                card?.setAttribute('data-moved', 'false');\n                // Keep the browser's exact down target and a primitive snapshot of its stable ID.\n                this.pressedCard = card; this.pressedFileId = card ? String(card.dataset.fileId || '') : null;`;
  const newDown=`                // Resolve the visually frontmost card at the physical pointer coordinate.\n                const hit = this.cardAtPoint(event.clientX, event.clientY);\n                const card = hit?.element || null;\n                card?.setAttribute('data-moved', 'false');\n                this.pressedCard = card; this.pressedFileId = hit ? String(hit.fileId || '') : null;`;
  const oldUp=`                    const releaseCard = this.cardAtPoint(event.clientX, event.clientY);\n                    const releasePath = event.composedPath?.() || [];\n                    const stillOnPressedCard = pressedCard && (releaseCard?.element === pressedCard || releasePath.includes(pressedCard));\n                    if (stillOnPressedCard) this.activateFileId(pressedFileId, pressedCard);`;
  const newUp=`                    const releaseCard = this.cardAtPoint(event.clientX, event.clientY);\n                    const stillOnPressedCard = pressedCard && releaseCard?.element === pressedCard;\n                    if (stillOnPressedCard) this.activateFileId(pressedFileId, pressedCard);`;
  if(!html.includes(oldDown)||!html.includes(oldUp)) throw new Error('Candidate patch anchors do not match canonical source');
  html=html.replace(oldDown,newDown).replace(oldUp,newUp);
  document.open(); document.write(html); document.close();
 }catch(error){ status.textContent='Candidate failed to load: '+error.message; }
})();
</script>
